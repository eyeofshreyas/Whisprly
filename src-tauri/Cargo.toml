[package]
name = "wisperflow"
version = "0.1.0"
description = "WisperFlow — Personal Dictation App"
edition = "2021"

[lib]
name = "wisperflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3"
reqwest = { version = "0.12", features = ["multipart", "json"] }
enigo = "0.2"
tempfile = "3"
rdev = "0.5"
dotenvy = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
