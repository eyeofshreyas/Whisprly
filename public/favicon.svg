<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1735" />
      <stop offset="100%" stop-color="#0E0B1C" />
    </linearGradient>

    <!-- Spectrum Bars Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8803A" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Glow Effect for Bars -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)" />

  <!-- Subtle inner border for premium feel -->
  <rect width="196" height="196" x="2" y="2" rx="42" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

  <!-- 13 spectrum bars tracing the W silhouette, bottom-aligned at y=152 -->
  <g filter="url(#glow)">
    <rect x="30"  y="48"  width="9" height="104" rx="4.5" fill="url(#barGrad)"/>
    <rect x="41"  y="76"  width="9" height="76"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="52"  y="107" width="9" height="45"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="63"  y="130" width="9" height="22"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="74"  y="110" width="9" height="42"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="85"  y="84"  width="9" height="68"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="96"  y="58"  width="9" height="94"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="107" y="84"  width="9" height="68"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="118" y="110" width="9" height="42"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="129" y="130" width="9" height="22"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="140" y="107" width="9" height="45"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="151" y="76"  width="9" height="76"  rx="4.5" fill="url(#barGrad)"/>
    <rect x="162" y="48"  width="9" height="104" rx="4.5" fill="url(#barGrad)"/>
  </g>
</svg>
