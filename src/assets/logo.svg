<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="#111118"/>

  <!-- Sound waves — left -->
  <path d="M 45,80 C 34,93 34,107 45,120"
        stroke="rgba(255,255,255,0.22)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M 29,67 C 12,86 12,114 29,133"
        stroke="rgba(255,255,255,0.10)" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- Microphone capsule -->
  <rect x="75" y="32" width="50" height="80" rx="25" fill="#ffffff"/>

  <!-- Sound waves — right -->
  <path d="M 155,80 C 166,93 166,107 155,120"
        stroke="rgba(255,255,255,0.22)" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M 171,67 C 188,86 188,114 171,133"
        stroke="rgba(255,255,255,0.10)" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- Stand arc -->
  <path d="M 55,110 C 55,152 145,152 145,110"
        stroke="#ffffff" stroke-width="8.5" fill="none" stroke-linecap="round"/>

  <!-- Stand pole -->
  <line x1="100" y1="152" x2="100" y2="170"
        stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="67" y1="170" x2="133" y2="170"
        stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"/>
</svg>
