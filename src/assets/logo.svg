<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>

    <!-- Base: vertical amber gradient — dark at bottom, bright amber mid, golden top -->
    <linearGradient id="wf-amber" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#7A2406"/>
      <stop offset="30%"  stop-color="#B84E18"/>
      <stop offset="65%"  stop-color="#E8803A"/>
      <stop offset="100%" stop-color="#F5A060"/>
    </linearGradient>

    <!-- Side lighting: left edge marginally warmer, right edge cooler — adds tube roundness -->
    <linearGradient id="wf-side" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFA060" stop-opacity="0.22"/>
      <stop offset="45%"  stop-color="#E8803A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6B2000" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Specular: cream highlight on lit upper surface of tube -->
    <linearGradient id="wf-spec" x1="0" y1="0" x2="0" y2="1"
                    gradientUnits="userSpaceOnUse" y1="30" y2="115">
      <stop offset="0%"   stop-color="#FFF4DC" stop-opacity="0.92"/>
      <stop offset="45%"  stop-color="#FFD89A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD89A" stop-opacity="0"/>
    </linearGradient>

    <!-- Chrome rim: sharp near-white glint at the very top edge -->
    <linearGradient id="wf-chrome" x1="0" y1="0" x2="0" y2="1"
                    gradientUnits="userSpaceOnUse" y1="28" y2="52">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Mask: the W tube silhouette -->
    <mask id="wf-mask">
      <path
        d="M 22,155 C 22,80 42,38 62,38 C 82,38 88,108 100,108 C 112,108 118,38 138,38 C 158,38 178,80 178,155"
        stroke="white" stroke-width="32" stroke-linecap="round" fill="none"
      />
    </mask>

    <!-- Outer glow filter -->
    <filter id="wf-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feFlood flood-color="#E8803A" flood-opacity="0.55" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── Layer 0: Ambient glow behind the shape ────────────────────────────── -->
  <path
    d="M 22,155 C 22,80 42,38 62,38 C 82,38 88,108 100,108 C 112,108 118,38 138,38 C 158,38 178,80 178,155"
    fill="none" stroke="#E8803A" stroke-width="40" stroke-linecap="round"
    opacity="0.20" filter="url(#wf-glow)"
  />

  <!-- ── Layer 1: Base amber fill (main tube body) ─────────────────────────── -->
  <rect x="0" y="0" width="200" height="200" fill="url(#wf-amber)" mask="url(#wf-mask)"/>

  <!-- ── Layer 2: Side lighting (adds tube roundness) ──────────────────────── -->
  <rect x="0" y="0" width="200" height="200" fill="url(#wf-side)"   mask="url(#wf-mask)"/>

  <!-- ── Layer 3: Specular highlight (lit upper surface) ───────────────────── -->
  <rect x="0" y="0" width="200" height="200" fill="url(#wf-spec)"   mask="url(#wf-mask)"/>

  <!-- ── Layer 4: Chrome rim (sharp reflective top edge) ───────────────────── -->
  <rect x="0" y="0" width="200" height="200" fill="url(#wf-chrome)" mask="url(#wf-mask)"/>

</svg>
